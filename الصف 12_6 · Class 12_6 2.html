--bg:#e9dfdc;--g1:#f3e7e4;--g2:#f2e8d9;--g3:#e9e0ea;--g4:#dfe8e2;--g5:#efe3e1;--paper:#f7f1ef;--ink:#2b0f16;--mar:#5b1b29;--deep:#3d0f1b;--brass:#c79a4a;--tag:#fffaf7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#190a0f;--g1:#1d0c13;--g2:#241222;--g3:#17161f;--g4:#13201d;--g5:#1c0d12;--paper:#26121a;--ink:#f1e4e0;--mar:#e8aab4;--deep:#2a0d16;--tag:#2f161f}}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--g1),var(--g2) 22%,var(--g3) 46%,var(--g4) 70%,var(--g5));color:var(--ink);font:400 17px/1.8 Cairo,system-ui,sans-serif;overflow-x:hidden}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--deep);color:#f7ece8;border-bottom:3px solid var(--brass)}
.brand{font:900 20px Cairo;margin-inline-end:auto;white-space:nowrap}
nav{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none}
nav a{color:#f7ece8;text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap;opacity:.85}
nav a:hover{opacity:1;color:var(--brass)}
#lg{font:900 15px Cairo;background:var(--brass);color:var(--deep);border:0;border-radius:99px;padding:5px 16px;cursor:pointer}
.hero{min-height:calc(100svh - 58px);display:grid;place-items:center;align-content:center;gap:10px;padding:18px 0 26px;text-align:center;background:linear-gradient(180deg,#0000 82%,var(--g1)),radial-gradient(ellipse at 50% 40%,#6d2234,var(--deep) 70%)}
.board{padding:10px;background:#2a0b13;border:3px solid var(--brass);border-radius:6px;box-shadow:0 30px 80px #0009,inset 0 0 0 2px #0006}
.stage{position:relative;width:min(92vw,calc((100svh - 190px)*1.3333));aspect-ratio:4/3;background:var(--wall) 0 0/100% 100%;overflow:hidden}
.pl{position:absolute;background-image:var(--photo);transform-origin:30% 26%;cursor:pointer;
-webkit-mask:linear-gradient(90deg,#0000,#000 9%,#000 91%,#0000),linear-gradient(0deg,#0000,#000 9%,#000 91%,#0000);-webkit-mask-composite:source-in;
mask:linear-gradient(90deg,#0000,#000 9%,#000 91%,#0000),linear-gradient(0deg,#0000,#000 9%,#000 91%,#0000);mask-composite:intersect;
transition:scale .25s;animation:drop .9s cubic-bezier(.2,.9,.3,1.25) var(--d) both,sway var(--t) ease-in-out calc(var(--d) + .9s) infinite alternate none}
.pl:hover{scale:1.22;z-index:5}
@keyframes drop{from{translate:0 -150%;rotate:-16deg;opacity:0}to{translate:0 0;rotate:0deg;opacity:1}}
@keyframes sway{from{rotate:0deg}to{rotate:var(--r)}}
.hero h1{margin:6px 0 0;font:900 clamp(28px,5vw,48px)/1.2 Cairo;color:#f7ece8}
.hero p{margin:0;color:var(--brass);font-weight:600}
section{max-width:1040px;margin:auto;padding:84px 20px 20px}
h2{margin:0 0 34px;font:900 clamp(34px,7vw,60px)/1.15 Cairo;color:var(--mar);-webkit-text-stroke:7px var(--paper);paint-order:stroke fill;text-shadow:3px 4px 0 var(--brass)}
:lang(en) h2,:lang(en) .hero h1{font-family:'Alfa Slab One',serif;font-weight:400}
.pg{position:fixed;top:0;inset-inline:0;height:4px;z-index:60;background:linear-gradient(90deg,var(--brass),#e8aab4);transform-origin:0 50%;transform:scaleX(0)}
html[dir=rtl] .pg{transform-origin:100% 50%}

.cue{width:16px;height:16px;border:solid var(--brass);border-width:0 4px 4px 0;rotate:45deg;margin-top:10px;animation:cue 1.5s ease-in-out infinite}
@keyframes cue{50%{translate:0 9px;opacity:.35}}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 18% 28%,#e8aab466,#0000 38%),radial-gradient(circle at 82% 58%,#c79a4a55,#0000 42%),radial-gradient(circle at 46% 92%,#9db9a966,#0000 40%);animation:drift 36s ease-in-out infinite alternate}
@keyframes drift{to{translate:6% -5%;scale:1.18;rotate:6deg}}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{opacity:.3}}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
section:not(.in) .a,section:not(.in) .w{opacity:0}
.in .a{animation:var(--an,pop) .85s cubic-bezier(.2,.9,.3,1.2) calc(var(--i,0)*80ms) backwards}
.in .w{animation:glow .6s ease-out calc(var(--i)*30ms + .5s) backwards}.w{display:inline-block}
@keyframes stamp{from{scale:2.8;rotate:-14deg;translate:0 -40px;opacity:0}60%{scale:.92}}
@keyframes flip{from{transform:perspective(600px) rotateX(-95deg) translateY(30px);opacity:0}}
@keyframes dropin{from{translate:0 -170%;opacity:0}}
@keyframes scatter{from{translate:var(--x) var(--y);rotate:var(--rr);scale:.1;opacity:0}}
@keyframes pop{from{scale:.2;opacity:0}}
@keyframes slide{from{translate:calc(var(--s)*70px) 0;opacity:0}}
@keyframes wipe{from{clip-path:inset(0 0 100% 0);opacity:0}}
@keyframes rise{from{scale:.7;rotate:-3deg;opacity:0}}
@keyframes glow{from{opacity:.08;filter:blur(5px);color:var(--brass)}}
@keyframes spin{to{rotate:360deg}}
@keyframes pulse{50%{box-shadow:inset 0 0 0 3px var(--brass),0 0 22px #c79a4aaa}}
.ch{display:inline-block;--an:stamp}
.mq{overflow:hidden;white-space:nowrap;direction:ltr;background:var(--brass);color:var(--deep);font:400 clamp(22px,5vw,34px)/1 'Alfa Slab One',Cairo,serif;padding:12px 0;margin:70px -4vw 0;rotate:-2deg;border-block:4px solid var(--deep)}
.mq span{display:inline-block;will-change:transform}.mq i{font-style:normal;padding-inline:18px}
.roles,.coms{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{--an:flip;position:relative;overflow:hidden;background:var(--mar);color:#f7ece8;padding:22px 20px;border:3px double var(--brass);display:grid;gap:4px;transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#fff4,#0000 55%);opacity:0;transition:opacity .2s}.card:hover::after{opacity:1}
.card small{color:var(--brass);font-weight:600;font-size:15px}.card b{font:900 24px/1.4 Cairo}
.vm{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-top:26px}
.vm>div{--an:wipe;background:var(--paper);border-inline-start:6px solid var(--brass);padding:22px 24px;box-shadow:0 10px 30px #0002}
.vm h3{margin:0 0 6px;font:900 24px Cairo;color:var(--mar)}.vm p{margin:0}
.coms{gap:26px}
.pen{--an:dropin;background:var(--mar);color:#f7ece8;padding:26px 16px 52px;text-align:center;clip-path:polygon(0 0,100% 0,100% 84%,50% 100%,0 84%);transform-origin:50% 0}
.in .pen.a{animation:dropin .95s cubic-bezier(.2,1.25,.4,1) calc(var(--i)*130ms) backwards,hang 4s ease-in-out var(--d) infinite alternate}
@keyframes hang{from{rotate:-1.6deg}to{rotate:1.6deg}}
.pen small{display:block;color:var(--brass);font-weight:600}.pen b{font:900 21px Cairo}
.fb{--an:rise;position:relative;overflow:hidden;text-align:center;padding:48px 20px;isolation:isolate}
.fb::before{content:"";position:absolute;z-index:-2;left:50%;top:50%;width:220%;aspect-ratio:1;translate:-50% -50%;background:conic-gradient(var(--brass),#0000 25%,var(--brass) 50%,#0000 75%,var(--brass));animation:spin 5s linear infinite}
.fb::after{content:"";position:absolute;z-index:-1;inset:4px;background:var(--paper)}
.fb a{display:inline-block;margin-top:10px;background:var(--mar);color:#f7ece8;font-weight:900;text-decoration:none;padding:12px 30px;border-radius:99px;animation:ping 2.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #c79a4aaa}70%,100%{box-shadow:0 0 0 18px #c79a4a00}}
.tw{overflow-x:auto;padding:4px 0 10px}
table{border-collapse:separate;border-spacing:6px;min-width:980px;width:100%;text-align:center}
th{background:var(--mar);color:#f7ece8;padding:10px 6px;border-radius:10px}th b{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 4px;border-radius:50%;background:var(--brass);color:var(--deep);font:900 17px Cairo}th bdi{font-size:12px;font-weight:600}
th.d{--an:slide;position:sticky;inset-inline-start:0;z-index:3;min-width:92px;font:900 17px Cairo}
td{--an:pop;background:color-mix(in srgb,hsl(var(--h) 60% 50%) 22%,var(--paper));border-radius:10px;border-block-end:4px solid hsl(var(--h) 60% 48%);padding:12px 6px;font-weight:600;font-size:14px;line-height:1.45;min-width:104px;transition:scale .2s}
td:hover{scale:1.09;position:relative;z-index:2}
.today th.d{background:var(--brass);color:var(--deep)}
.in .today td.a{animation:pop .85s cubic-bezier(.2,.9,.3,1.2) calc(var(--i)*80ms) backwards,pulse 2.4s ease-in-out 1.6s infinite}
.note{text-align:center;color:var(--mar);font-weight:600}
.big{--an:stamp;display:flex;align-items:baseline;justify-content:center;gap:14px;margin-bottom:30px}
.big b{font:400 clamp(70px,16vw,140px)/1 'Alfa Slab One',Cairo,serif;color:var(--mar);-webkit-text-stroke:6px var(--paper);paint-order:stroke fill;text-shadow:4px 5px 0 var(--brass)}.big span{font:900 26px Cairo;color:var(--mar)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px 16px;padding:10px 4px}
.tag{--an:scatter;position:relative;background:var(--tag);padding:18px 14px 14px;text-align:center;font-weight:600;box-shadow:0 8px 18px #0003;rotate:var(--tr);transition:rotate .3s,scale .3s}
.tag:hover{rotate:0deg;scale:1.1}.tag::before{content:"🎓";position:absolute;top:-14px;inset-inline-start:-6px;font-size:22px;rotate:-14deg}
footer{margin-top:60px;padding:90px 30px 30px;text-align:center;background:linear-gradient(180deg,#0000,var(--deep) 70%);color:var(--brass);font-weight:600}
